name: C++ camera client CI

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes g++ make libboost-system-dev nlohmann-json3-dev

      - name: Clean build and unit tests
        run: make -C client ci
